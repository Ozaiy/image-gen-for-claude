name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -v

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Check the Claude Code plugin's bundled server is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          git status --porcelain -- ../plugin
          test -z "$(git status --porcelain -- ../plugin)" || { echo "plugin/ differs from a fresh build: run 'npm run build' in typescript/ and commit plugin/"; exit 1; }
      - run: npm test
      - run: npm run pack:mcpb
