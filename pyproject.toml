[project]
name = "image-gen-for-claude"
version = "0.6.0"
description = "MCP server that generates images with OpenAI (gpt-image) or FLUX (Black Forest Labs) and saves them to disk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozcan Isik" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "openai>=3,<4",
    "pillow>=10",
    "platformdirs>=4.3",
]
keywords = ["mcp", "openai", "image-generation", "claude", "gpt-image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Ozaiy/image-gen-for-claude"
Issues = "https://github.com/Ozaiy/image-gen-for-claude/issues"

[project.scripts]
image-gen-for-claude = "image_gen_for_claude.server:main"
# The name before 0.6.0, so existing `uvx --from git+... openai-image-mcp` configs keep working
openai-image-mcp = "image_gen_for_claude.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
