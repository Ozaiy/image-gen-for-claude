[project]
name = "openai-image-mcp"
version = "0.3.0"
description = "MCP server that generates images with the OpenAI Images API and saves them to disk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozcan Isik" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "openai>=3,<4",
    "pillow>=10",
    "platformdirs>=4.3",
]
keywords = ["mcp", "openai", "image-generation", "claude", "gpt-image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Ozaiy/openai-image-mcp-for-claude"
Issues = "https://github.com/Ozaiy/openai-image-mcp-for-claude/issues"

[project.scripts]
openai-image-mcp = "openai_image_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
